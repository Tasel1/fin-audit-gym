[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-audit-gym"
version = "0.1.0"
description = "Reproducible FinTech RL Environment & Benchmark Simulator for AI Financial Audit Models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tasel", email = "botash860@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-p no:pytest-qt"

